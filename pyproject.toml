[project]
name = "n8n-mcp-server"
version = "1.0.0"
description = "MCP server for n8n workflow automation - manage workflows, executions, credentials and build pipelines"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
n8n-mcp-server = "src.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"
