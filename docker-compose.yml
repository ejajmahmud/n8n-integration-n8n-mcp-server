version: "3.9"

services:
  n8n-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      N8N_BASE_URL: ${N8N_BASE_URL:-http://localhost:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
